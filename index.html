<html lang="en"><head><meta charset="utf-8">

<style>
:root{--k:#10080F;--b1:#210D19;--b2:#77284F;--r:#D77AA8;--c:#FCEBD9;--serif:'Cormorant Garamond',Georgia,serif;--sans:'Inter',system-ui,sans-serif}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}

@keyframes gr{0%{transform:translate(0,0)}20%{transform:translate(-4%,3%)}40%{transform:translate(3%,-4%)}60%{transform:translate(-3%,-2%)}80%{transform:translate(4%,4%)}100%{transform:translate(0,0)}}

#fin .lock .lf{z-index:2;filter:drop-shadow(0 0 22px rgba(215,122,168,.4))}
#fin .q{font:italic 400 clamp(24px,6vw,34px) var(--serif);color:var(--c);transition-delay:7.2s}

<div id="ld"><i></i><p>gathering stars</p></div>
<canvas id="c"></canvas><div id="halo"></div>
<div id="a1">
  <p class="ln" id="l1">for zainab.</p>
  <p class="ln" id="l2">there’s a universe that only holds together because of you.</p>

</div>
<div id="fl2"></div>
<div id="grain"></div><div id="vig"></div>
<script>

 const dl=ac.createDelay(),fb=ac.createGain(),wet=ac.createGain();dl.delayTime.value=.42;fb.gain.value=.42;wet.gain.value=.4;
 master.connect(ac.destination);master.connect(dl);dl.connect(fb);fb.connect(dl);dl.connect(wet);wet.connect(ac.destination);}

 o.frequency.value=f;o2.type='triangle';o2.frequency.value=f*2;g2.gain.value=.22;
 g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(v,t+.012);g.gain.exponentialRampToValueAtTime(.0001,t+d);
 o.connect(g);o2.connect(g2);g2.connect(g);g.connect(master);o.start(t);o2.start(t);o.stop(t+d+.1);o2.stop(t+d+.1);}

 r.addColorStop(0,'rgba(255,255,255,1)');r.addColorStop(.25,col);r.addColorStop(1,'rgba(0,0,0,0)');x.fillStyle=r;x.fillRect(0,0,32,32);return c}
const SP=[sprite('rgba(215,122,168,.85)'),sprite('rgba(252,235,217,.8)')];
const N=2000,P=[];
for(let i=0;i<N;i++){const t=Math.random()*6.2832,r=i<N*.35?1:Math.pow(Math.random(),.5),
 x=16*Math.sin(t)**3,y=13*Math.cos(t)-5*Math.cos(2*t)-2*Math.cos(3*t)-Math.cos(4*t);
 P.push({hx:x*r,hy:2+(y-2)*r,x:Math.random()*W,y:Math.random()*H,k:.022+Math.random()*.05,s:.7+Math.random()*1.5,ph:Math.random()*6.28,c:Math.random()<.72?0:1,tx:0,ty:0,sa:0,sr:1})}

 x.font=`italic 600 ${fs}px "Cormorant Garamond",Georgia,serif`;const lh=fs*1.4,y0=H/2-(lines.length-1)*lh/2;lines.forEach((l,i)=>x.fillText(l,W/2,y0+i*lh));return scan(o,2,(d,i)=>d[i+3]>128)}
function fbKitty(){const o=[],cx=W/2,cy=H*.4,r=Math.min(W*.3,H*.18);
 const L=(a,b,c,d)=>{for(let u=0;u<=1;u+=.025)o.push([a+(c-a)*u,b+(d-b)*u])};

 [-1,1].forEach(s=>{L(cx+s*r*1.1,cy-r*.65,cx+s*r*1.0,cy-r*1.35);L(cx+s*r*1.0,cy-r*1.35,cx+s*r*.45,cy-r*.95);
